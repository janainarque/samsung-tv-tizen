<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung TV Tizen</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="home">
        <header class="topbar">
            <div class="identity"><span class="brand-mark" aria-hidden="true">S╱</span><strong>Samsung TV Tizen</strong></div>
            <span class="page-label">Início<span class="page-dot" aria-hidden="true"></span></span>
            <div class="topbar-actions"><time id="clock" aria-label="Horário atual">--:--</time><span class="divider" aria-hidden="true"></span><button id="samsung-original" class="system-button" type="button">Samsung Original <span aria-hidden="true">↗</span></button></div>
        </header>
        <main>
            <section class="hero" aria-labelledby="hero-title">
                <div class="hero-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="planet"></div><div class="horizon"></div></div>
                <div class="hero-content">
                    <p class="eyebrow">BEM-VINDO</p>
                    <h1 id="hero-title">Seu próximo <em>universo.</em></h1>
                    <p class="hero-description">Filmes, vídeos, anime e música. Escolha por onde começar.</p>
                </div>
            </section>
            <section class="apps-section" aria-labelledby="apps-title">
                <div class="section-heading"><h2 id="apps-title">Seus aplicativos</h2><span id="demo-note">Demonstração</span></div>
                <div class="app-grid">
                    <button class="app-card netflix" type="button" data-app="Netflix" aria-describedby="demo-note"><span class="app-logo">NETFLIX</span></button>
                    <button class="app-card youtube" type="button" data-app="YouTube" aria-describedby="demo-note"><span class="app-logo"><span class="play-mark" aria-hidden="true">▶</span>YouTube</span></button>
                    <button class="app-card prime" type="button" data-app="Prime Video" aria-label="Prime Video" aria-describedby="demo-note"><span class="app-logo">prime video<span class="prime-smile" aria-hidden="true"></span></span></button>
                    <button class="app-card disney" type="button" data-app="Disney+" aria-describedby="demo-note"><span class="app-logo">Disney<span>+</span></span></button>
                    <button class="app-card crunchyroll" type="button" data-app="Crunchyroll" aria-describedby="demo-note"><span class="app-logo"><span class="crunchy-mark" aria-hidden="true"></span>crunchyroll</span></button>
                    <button class="app-card spotify" type="button" data-app="Spotify" aria-describedby="demo-note"><span class="app-logo"><span class="spotify-mark" aria-hidden="true">≋</span>Spotify</span></button>
                </div>
            </section>
        </main>
        <footer><p class="remote-hint"><span aria-hidden="true">↔ ↕</span> Navegar <span class="ok-key">OK</span> Selecionar</p></footer>
        <p id="exit-status" class="status-message" role="status" aria-live="polite"></p>
    </div>

    <script src="js/tizen.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
